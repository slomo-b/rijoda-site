<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Stylized Alps">
  <defs>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EADFD5"/><stop offset="1" stop-color="#DCC7B8"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8B39D"/><stop offset="1" stop-color="#C4886B"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BD7A5C"/><stop offset="1" stop-color="#8E4A31"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0" stop-color="#A85B3E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A85B3E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <ellipse cx="800" cy="330" rx="620" ry="360" fill="url(#glow)"/>

  <!-- far range -->
  <path d="M-40 640 L180 470 L300 560 L500 300 L690 480 L800 235 L915 470 L1120 315 L1320 520 L1490 425 L1640 615 L1640 1040 L-40 1040 Z"
        fill="url(#r3)" opacity="0.85" filter="url(#soft2)"/>

  <!-- mid range -->
  <path d="M-40 820 L150 665 L345 770 L560 555 L720 705 L800 455 L895 665 L1085 540 L1290 725 L1470 615 L1640 805 L1640 1040 L-40 1040 Z"
        fill="url(#r2)" opacity="0.92"/>

  <!-- summit highlight -->
  <path d="M800 235 L862 360 L800 470 L738 360 Z" fill="#F2E4DA" opacity="0.32" filter="url(#soft)"/>

  <!-- front range -->
  <path d="M-40 1010 L215 830 L420 935 L640 775 L820 905 L1010 760 L1225 885 L1450 800 L1640 960 L1640 1040 L-40 1040 Z"
        fill="url(#r1)"/>
</svg>
