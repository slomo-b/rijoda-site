server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Never serve repository metadata.
  location ~ /\.(?!well-known) {
    deny all;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(woff2|svg|js|css|png|jpg|jpeg|webp|avif|glb)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = /sitemap.xml {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
